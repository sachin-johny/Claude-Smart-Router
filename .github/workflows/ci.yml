name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Verify --help exits cleanly
        run: node router.js --help

  package-sanity:
    name: Package sanity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Validate config.example.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('config.example.json', 'utf8')); console.log('config.example.json OK')"

      - name: Dry-run npm pack (fails on missing "files" entries)
        run: npm pack --dry-run

      - name: Check package.json "files" list matches repo
        run: |
          for f in $(node -p "require('./package.json').files.join('\n')"); do
            if [ ! -e "$f" ]; then
              echo "::error::package.json 'files' lists '$f' but it does not exist in the repo"
              exit 1
            fi
          done
          echo "All files in package.json 'files' exist."
